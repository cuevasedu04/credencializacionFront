<!-- Modal de captura de fotografía -->
<ng-template #modalCamara>
  <div class="position-relative bg-dark text-center" style="min-height: 350px;">
    <video #videoElement autoplay class="w-100" style="max-height: 400px;"
           *ngIf="!fotoCapturada && stream"></video>

    <div *ngIf="!fotoCapturada && !stream"
         class="d-flex align-items-center justify-content-center text-white" style="height: 300px;">
      <div>
        <i class="fas fa-camera-retro fa-3x mb-3"></i>
        <p class="mb-0">Cámara no detectada.<br>Puedes subir el archivo.</p>
      </div>
    </div>

    <canvas #canvasCaptura class="d-none"></canvas>
    <img *ngIf="fotoCapturada" [src]="fotoCapturada" class="img-fluid" style="max-height: 400px;">

    <div class="mt-3 p-3 bg-light rounded-top">
      <div class="alert alert-info py-2 px-3 small mb-2" *ngIf="avisoCamara">
        <i class="fas fa-circle-info"></i> {{ avisoCamara }}
      </div>

      <div *ngIf="!fotoCapturada">
        <div class="px-4 mb-2" *ngIf="dispositivosVideo.length > 1">
          <select class="form-control form-control-sm"
                  [(ngModel)]="camaraSeleccionadaId" (change)="cambiarCamara($event)">
            <option *ngFor="let cam of dispositivosVideo" [value]="cam.deviceId">
              {{ cam.label || 'Cámara' }}
            </option>
          </select>
        </div>

        <button *ngIf="stream" class="btn btn-primary btn-lg mx-2" (click)="capturarFoto()">
          <i class="fas fa-camera"></i> Tomar foto
        </button>
        <input type="file" #fileFoto hidden accept="image/*" (change)="onArchivoFoto($event)">
        <button class="btn btn-secondary btn-lg mx-2" (click)="fileFoto.click()">
          <i class="fas fa-upload"></i> Subir archivo
        </button>
      </div>

      <div *ngIf="fotoCapturada">
        <button class="btn btn-secondary mr-3 me-2" (click)="fotoCapturada = null; iniciarCamara()">
          <i class="fas fa-redo"></i> Repetir
        </button>
        <button class="btn btn-danger" (click)="confirmarFoto()">
          <i class="fas fa-check"></i> Aceptar
        </button>
      </div>
    </div>
  </div>
</ng-template>

<!-- Modal de captura de firma -->
<ng-template #modalFirma>
  <div class="text-center py-3">
    <div class="border d-inline-block bg-white shadow-sm position-relative"
         style="width: 400px; height: 200px; border: 2px dashed #ccc; touch-action: none;">
      <canvas #firmaCanvas class="cm-firma-canvas"
              (mousedown)="startDrawing($event)"
              (mousemove)="moveDrawing($event)"
              (mouseup)="stopDrawing()"
              (mouseleave)="stopDrawing()"
              (touchstart)="startDrawing($event)"
              (touchmove)="moveDrawing($event)"
              (touchend)="stopDrawing()"
              style="width: 100%; height: 100%;"></canvas>
      <small class="text-muted position-absolute"
             style="bottom: 5px; left: 0; right: 0; pointer-events: none;">
        Firme dentro del recuadro
      </small>
    </div>

    <div class="mt-3 d-flex justify-content-center gap-2 flex-wrap">
      <button class="btn btn-outline-danger btn-sm" (click)="limpiarFirma()">
        <i class="fas fa-eraser"></i> Limpiar
      </button>
      <input type="file" #fileFirma hidden accept="image/*" (change)="onArchivoFirma($event)">
      <button class="btn btn-outline-secondary btn-sm" (click)="fileFirma.click()">
        <i class="fas fa-upload"></i> Subir firma
      </button>
      <button *ngIf="isWacomSupported && !wacomConnected" class="btn btn-secondary btn-sm"
              (click)="conectarWacom()">
        <i class="fas fa-pen-nib"></i> Wacom
      </button>
      <span *ngIf="wacomConnected" class="badge bg-success p-2">
        <i class="fas fa-plug"></i> Tableta conectada
      </span>
    </div>

    <div class="alert alert-info py-2 px-3 small mt-3 mx-4 mb-0" *ngIf="avisoWacom">
      <i class="fas fa-circle-info"></i> {{ avisoWacom }}
    </div>
  </div>
</ng-template>
