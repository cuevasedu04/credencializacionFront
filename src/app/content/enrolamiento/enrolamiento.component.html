<div class="container-fluid p-4">

    <header class="bg-light border-bottom mb-4">
        <div class="container py-4 px-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="p-2 bg-success rounded">
                        <i class="fas fa-user-plus text-white fs-4"></i>
                    </div>
                    <div>
                        <h1 class="fw-bold text-dark mb-1">Enrolamiento</h1>
                        <p class="text-muted mb-0">Busque un empleado para realizar su enrolamiento</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2 text-muted small" *ngIf="!modoBloqueFijo">
                    <div class="btn-group" role="group">
                        <button type="button"
                                class="btn btn-outline-secondary btn-sm"
                                [class.active]="modeloCredencialSeleccionado === 'anam'"
                                (click)="cambiarModeloCredencial('anam')">
                            ANAM    
                        </button>
                        <button type="button"
                                class="btn btn-outline-secondary btn-sm"
                                [class.active]="modeloCredencialSeleccionado === 'nuevoLaredo'"
                                (click)="cambiarModeloCredencial('nuevoLaredo')">
                            Nuevo Laredo
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="row">
        <!-- Panel izquierdo: Búsqueda y DataTable -->
        <div class="col-lg-5 mb-4">
            <app-consulta-enrolamiento 
                (empleadoEncontrado)="recibirEmpleado($event)">
            </app-consulta-enrolamiento>
        </div>

        <!-- Panel derecho: Plantilla de credencial -->
        <div class="col-lg-7">
            <app-plantilla-anam
                *ngIf="modeloCredencialSeleccionado === 'anam'; else plantillaNuevoLaredo"
                [empleado]="empleadoSeleccionado"
                [editable]="true"
                [mostrarHeader]="false"
                (enrolamientoCompletado)="onEnrolamientoCompletado()">
            </app-plantilla-anam>

            <ng-template #plantillaNuevoLaredo>
                <app-provisional 
                    [empleado]="empleadoSeleccionado"
                    [editable]="true"
                    [mostrarHeader]="false"
                    (enrolamientoCompletado)="onEnrolamientoCompletado()">
                </app-provisional>
            </ng-template>
        </div>
    </div>
</div>
