<div class="container-fluid p-4 d-flex align-items-between justify-content-between flex-column h-100">
        <div class="mt-2">

        <!-- Main Content -->
        <main class="d-flex justify-content-start align-items-center flex-row ">
            <!-- mensaje de bienvenida dentro de una card  -->
                <div>
                <img src="img/ICONO CARPETA.svg" alt="" width="80%">
                </div>
            <div class="card w-100">
                <div class="card-body">
                    <h1 class="card-title frmlabel m-0 p-0">Sistema de Credencialización y Enrolamiento</h1>
                    <p class="card-text"></p>
                    <p class="card-text">Aquí podrás realizar consultas, enrolamientos e impresiones de credenciales para el personal de la ANAM.</p>
                    <p class="card-text">Para empezar, selecciona alguno de los modulos a continuación.</p>
                    <!-- <a href="/enrolamiento" class="btn btn-primary mx-2">Enrolar</a>
        
                    <a href="/credencializacion" class="btn btn-primary mx-2">Imprimir credenciales</a>                        
                     -->
                </div>
            </div>

            <!-- Aquí puedes agregar más contenido -->

        </main>

        <section class="module-blocks card w-100 mt-4">
            <div class="card-body">
                <h4 class="frmlabel mb-3">Módulos del sistema</h4>
                <div class="module-blocks-grid">
                    <button
                        type="button"
                        class="module-block anam"
                        [class.active]="esBloqueActivo('anam')"
                        (click)="seleccionarBloque('anam')">
                        <div class="module-title">Credenciales ANAM</div>
                        <div class="module-text">Aquí puedes generar credenciales para el personal de la ANAM.</div>
                        <span class="module-link">ANAM</span>
                    </button>

                    <button
                        type="button"
                        class="module-block nuevo-laredo"
                        [class.active]="esBloqueActivo('nuevo-laredo')"
                        (click)="seleccionarBloque('nuevo-laredo')">
                        <div class="module-title">Credenciales Nuevo Laredo</div>
                        <div class="module-text">Aquí puedes generar credenciales para el personal de ANAM Nuevo Laredo.</div>
                        <span class="module-link">Nuevo Laredo</span>
                    </button>

                    <button
                        type="button"
                        class="module-block consultas"
                        [class.active]="esBloqueActivo('consultas')"
                        (click)="seleccionarBloque('consultas')">
                        <div class="module-title">Consultas, carga e impresión</div>
                        <div class="module-text">Búsqueda avanzada, reportes, carga excel e impresión.</div>
                        <span class="module-link">Consultas e impresión</span>
                    </button>
                </div>
            </div>
        </section>
        </div>
</div>
